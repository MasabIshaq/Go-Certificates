<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink:#1c2b23; --paper:#f6f3ea; --seal:#2f6d4f; --seal-dark:#1f4a35;
    --gold:#a9822f; --line:#d8d0bb; --muted:#6b6558; --error:#a13d2f; --bubble:#eee8d8;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter', sans-serif; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; padding:32px 20px 60px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--seal); margin-bottom:8px;
  }
  h1{
    font-family:'Fraunces', serif; font-size:26px; margin:0 0 24px; font-weight:600;
  }
  .layout{
    width:100%; max-width:640px; display:flex; flex-direction:column; gap:16px;
  }
  .chat-box{
    background:#fffdf8; border:1px solid var(--line); border-radius:6px;
    display:flex; flex-direction:column; height:420px;
  }
  .messages{
    flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px;
  }
  .msg{
    max-width:80%; padding:10px 14px; border-radius:10px; font-size:14px; line-height:1.5;
    white-space:pre-wrap;
  }
  .msg.bot{ background:var(--bubble); align-self:flex-start; border-bottom-left-radius:2px; }
  .msg.user{ background:var(--seal); color:#fdfaf2; align-self:flex-end; border-bottom-right-radius:2px; }
  .msg.system{ background:transparent; color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:11px; align-self:center; }

  .chat-input{
    display:flex; border-top:1px solid var(--line);
  }
  .chat-input input{
    flex:1; border:none; padding:14px 16px; font-size:14px; background:transparent; outline:none;
    font-family:'Inter',sans-serif;
  }
  .chat-input button{
    padding:14px 20px; background:var(--seal); color:#fdfaf2; border:none; cursor:pointer; font-weight:600;
  }
  .chat-input button:hover{ background:var(--seal-dark); }

  .preview-card{
    background:#fffdf8; border:1px solid var(--line); border-radius:6px; padding:20px; display:none;
  }
  .preview-card.show{ display:block; }
  .preview-card img{ width:100%; border-radius:3px; border:1px solid var(--line); margin-bottom:14px; }
  .preview-actions{ display:flex; gap:10px; }
  .preview-actions button{
    flex:1; padding:12px; border:none; border-radius:3px; font-weight:600; cursor:pointer; font-size:14px;
  }
  .btn-save{ background:var(--ink); color:#fdfaf2; }
  .btn-regen{ background:var(--bubble); color:var(--ink); }
  .status-line{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); min-height:18px;
  }
  .status-line.error{ color:var(--error); }
  .status-line.ok{ color:var(--seal); }

  .warn{
    font-size:12px; color:var(--muted); background:var(--bubble); border-radius:4px; padding:10px 14px;
    line-height:1.5;
  }
</style>
</head>
<body>

<div class="eyebrow">Admin Only</div>
<h1>Certificate Generator</h1>

<div class="layout">
  <div class="warn">
    ⚠ This page can generate images and push commits to your GitHub repo. Don't share this link or deploy it publicly without adding authentication.
  </div>

  <div class="chat-box">
    <div class="messages" id="messages"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="e.g. name: Ali Khan" autocomplete="off">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div class="status-line" id="statusLine"></div>

  <div class="preview-card" id="previewCard">
    <img id="previewImg" src="" alt="Generated certificate preview">
    <div class="preview-actions">
      <button class="btn-regen" onclick="regenerate()">Regenerate</button>
      <button class="btn-save" onclick="saveCertificate()">Save to GitHub</button>
    </div>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const chatInput = document.getElementById('chatInput');
  const statusLine = document.getElementById('statusLine');
  const previewCard = document.getElementById('previewCard');
  const previewImg = document.getElementById('previewImg');

  let history = [];
  let collected = {};
  let lastGeneratedImage = null;

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setStatus(text, type) {
    statusLine.textContent = text || '';
    statusLine.className = 'status-line' + (type ? ' ' + type : '');
  }

  async function bootstrap() {
    addMsg('bot', "Let's build a certificate. Tell me the recipient's name, reference number, course title, and website/brand name — one at a time or all at once like:\nname: Ali Khan, reference: 0009, course: Web Dev Basics, website: Go Projects");
  }

  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;
    addMsg('user', text);
    chatInput.value = '';
    history.push({ role: 'user', content: text });

    setStatus('Thinking...');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, collected })
      });
      const data = await res.json();
      collected = data.collected || collected;
      addMsg('bot', data.reply);
      history.push({ role: 'assistant', content: data.reply });
      setStatus('');

      if (data.done) {
        await generateCertificate();
      }
    } catch (e) {
      setStatus('Error talking to server: ' + e.message, 'error');
    }
  }

  async function generateCertificate() {
    setStatus('Generating certificate with AI... this can take a few seconds', '');
    previewCard.classList.remove('show');
    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(collected)
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || 'Generation failed');
      }
      const data = await res.json();
      lastGeneratedImage = data.image_base64;
      previewImg.src = lastGeneratedImage;
      previewCard.classList.add('show');
      setStatus('Preview ready. Review it, then Save or Regenerate.', 'ok');
    } catch (e) {
      setStatus('Generation error: ' + e.message, 'error');
      addMsg('system', 'Generation failed — you can try "regenerate" or re-check your details.');
    }
  }

  async function regenerate() {
    await generateCertificate();
  }

  async function saveCertificate() {
    if (!lastGeneratedImage) return;
    setStatus('Saving to GitHub...', '');
    try {
      const res = await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          reference: collected.reference,
          name: collected.name,
          course: collected.course,
          image_base64: lastGeneratedImage
        })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || 'Save failed');
      }
      const data = await res.json();
      setStatus('Saved! Reference "' + data.reference + '" is live. Vercel will redeploy shortly.', 'ok');
      addMsg('system', 'Saved to GitHub: ' + data.file);

      // reset for next certificate
      collected = {};
      history = [];
      lastGeneratedImage = null;
      previewCard.classList.remove('show');
      addMsg('bot', "Saved. Want to make another? Just give me the next set of details.");
    } catch (e) {
      setStatus('Save error: ' + e.message, 'error');
    }
  }

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  bootstrap();
</script>
</body>
</html>
